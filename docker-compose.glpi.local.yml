version: "3.9"

# ══════════════════════════════════════════════════════════════════
#  Override pour connecter le backend à la stack GLPI existante
#  Usage :
#    docker compose \
#      -f docker-compose.yml \
#      -f docker-compose.glpi.local.yml \
#      up -d
# ══════════════════════════════════════════════════════════════════

services:
  backend:
    environment:
      - USE_MOCK_DATA=false
      # nginx = conteneur glpi-nginx-1 sur le réseau glpi_default
      - GLPI_BASE_URL=http://nginx
    networks:
      - dashboard-net
      - glpi_default   # rejoint le réseau de la stack GLPI

  redis:
    networks:
      - dashboard-net

  postgres:
    networks:
      - dashboard-net

networks:
  glpi_default:
    external: true   # réseau créé par la stack glpi (docker compose -p glpi up)